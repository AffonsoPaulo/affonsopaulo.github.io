name: qualidade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Formatação
        run: npx --yes prettier --check "**/*.{html,css,yml,json}"

      - name: Validar o HTML
        run: npx --yes html-validate index.html en/index.html 404.html

      - name: Servir localmente
        run: |
          npx --yes serve -l 8080 . &
          npx --yes wait-on http://localhost:8080

      - name: Acessibilidade (axe)
        run: npx --yes @axe-core/cli http://localhost:8080 http://localhost:8080/en/ --exit

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080
            http://localhost:8080/en/
          uploadArtifacts: true
