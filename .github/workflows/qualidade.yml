name: qualidade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Formatação
        run: npx --yes prettier@3 --check "**/*.{html,css,yml,json}"

      - name: Validar o HTML
        run: npx --yes html-validate@11 index.html en/index.html 404.html

      - name: Servir localmente
        run: |
          npx --yes serve@14 -l 8080 . &
          npx --yes wait-on@9 http://localhost:8080

      - name: Acessibilidade
        run: npx --yes pa11y-ci@4

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
            http://localhost:8080/en/
          uploadArtifacts: true
